            redirectType:
              type:
                - string
              default: DIV
              enum:
                - DIV
                - URL
              description: Type of redirect content returned by card gateway.
    FailedCardCollectionResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessfulTransactionResponse'
        - type: object
          properties:
            redirectUrl:
              type:
                - "null"
              description: HTML returned by card gateway. Render this for your end-user to complete the 3D Secure challenge.
              default: "null"
            redirectType:
              type:
                - "null"
              default: "null"
              enum:
                - DIV
                - URL
              description: Type of redirect content returned by card gateway.
    RetrievedTransactionResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          properties:
            code:
              type: string
              enum:
                - '00'
                - '01'
                - '02'
              description: PeoplesPay code representation of request outcome. Deprecated; do not use.
              deprecated: true
            status:
              type: string
              enum:
                - paid
                - pp
                - failed
                - pc
                - TCS-PENDING
              description: Transaction [status](/concepts/transactions).
            transactionId:
              type: string
              description: The PeoplesPasy ID of the transaction being looked up. Alternatively, it is the PeoplesPay ID of the first returned transaction if multiple transactions were retrieved i.e. the `externalTransactionId` passed matches more than one record.
            reference:
              type: string
              description: Generic transaction reference.
              deprecated: true
            data:
              type: object<[Transaction]()>
              description: "Contains [`Transaction`](/api-reference/transactions) object."
    RetrievedBalanceResponse:
