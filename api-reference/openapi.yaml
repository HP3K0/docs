openapi: 3.1.0
info:
  title: PeoplesPay API Documentation
  description: PeoplesPay API endpoints, payloads and relevant notes.
  license:
    name: MIT
  version: 1.0.0
servers:
  - url: https://peoplespay.com.gh/peoplepay
security: []
webhooks:
  transaction.status.updated:
    post:
      summary: Webhook notification sent on transaction status update
      requestBody:
        description: testing
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TypeOfTransactionToken'
        required: true
      responses:
        '200':
          description: Token generation response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessfulTokenResponse'
paths:
  /hub/token/get:
    post:
      summary: Get a token
      security: []
      requestBody:
        description: Specifed operation for given merchant and API user
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TypeOfTransactionToken'
        required: true
      responses:
        '200':
          description: Successfully generated token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessfulTokenResponse'
        '400':
          description: Bad request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /hub/collectmoney:
    post:
      summary: Collect money (via momo)
      description: Initiates a request to pay, sent to the specified mobile number
      security:
        - operationAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MomoCollections'
      responses:
        '200':
          description: Successfully received request to collect.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessfulTransactionResponse'
        '400':
          description: Bad request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthenticated request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorUnauthorizedToken'
  /hub/collectmoney/card:
    post:
      summary: Collect money (via card)
      description: Initiates a request to pay, to the provided bank card
      security:
        - operationAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CardCollections'
      responses:
        '200':
          description: Successfully received request to collect.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InitiatedCardCollectionResponse'
        '500':
          description: Received request to collect, but transaction failed.
          content: 
            application/json:
              schema:
                $ref: '#/components/schemas/FailedCardCollectionResponse'
        '400':
          description: Bad request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthenticated request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorUnauthorizedToken'
  /api/checkout/redirect/init:
    post:
      summary: Collect money (via hosted checkout)
      description: Initiates a request to pay, via an online checkout page.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckoutCollections'
      responses:
        '200':
          description: Response for successfully received request to collect
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessfulTransactionResponse'
  /hub/disburse:
    post:
      summary: Disburse money
      description: Initiates a disbursement request (to phone number or bank account)
      security:
        - operationAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Disbursements'
      responses:
        '200':
          description: Response for successfully received request to disburse
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessfulTransactionResponse'
        '400':
          description: Bad request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthenticated request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorUnauthorizedToken'

  /hub/remittance/terminate:
    post:
      summary: Terminate remittance
      description: Initiates remittance termination, by sending the requested amount to the target recipient.
      security:
        - operationAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RemittanceTermination'
      responses:
        '200':
          description: Response for successfully received request to terminate remittance.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessfulTransactionResponse'
  /merchants/login:
    post:
      security: []
      summary: Log in (merchant)
      description: Log in as merchant user
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MerchantLogin'
      responses:
        '200':
          description: Logged in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessfulMerchantLoginResponse'
        '401':
          description: Invalid credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnsuccessfulMerchantLoginResponse'
        '400':
          description: Bad request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /hub/transactions/get/{id}:
    get:
      description: Retrieves a transaction based on the supplied ID.
      summary: Get transaction by ID
      security:
        - adminAuth: []
      parameters:
        - name: id
          in: path
          description: ID of transaction to retrieve. Can be a PeoplesPay transaction ID or an `externalTransactionId`.
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Transaction successfully retrieved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetrievedTransactionResponse'
        '400':
          description: Bad request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthenticated request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorUnauthorized'
        '500':
          description: Transaction not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionNotFoundResponse'
  /hub/summary/filter:
    get:
      summary: Get transaction history
      description: Retrieves transaction history for current merchant
      security:
        - adminAuth: []
      parameters:
        - name: id
          in: query
          description: ID of the merchant account
          required: true
          schema:
            type: string
        - name: startDate
          in: query
          description: Start date of transaction history filter
          required: true
          schema:
            type: string
        - name: endDate
          in: query
          description: End data of transaction history filter
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Transactions retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetrievedAllTransactionsResponse'
        '400':
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /hub/get-balance:
    get:
      summary: Get current balance
      description: Retrieves balance for currently logged in merchant account.
      security:
        - adminAuth: []
      responses:
        '200':
          description: Balance successfully retrieved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetrievedBalanceResponse'
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthenticated request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorUnauthorized'
  /merchants/profile:
    get:
      summary: Get logged in merchant
      description: Retrieves details for currently logged in merchant
      security:
        - adminAuth: []
      responses:
        '200':
          description: Merchant successfully retrieved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetrievedMerchantResponse'
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthenticated request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorUnauthorized'
        '500':
          description: Error when retrieving merchant details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /merchants/users:
    get:
      summary: Get merchant users
      description: Retrieves user details for currently logged in merchant
      security:
        - adminAuth: []
      responses:
        '200':
          description: Merchant successfully retrieved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetrievedMerchantUsersResponse'
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthenticated request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorUnauthorized'
        '500':
          description: Error when retrieving merchant users.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /hub/merchant/enquiry:
    post:
      summary: Recipient name enquiry
      description: Retrieves name of target recipient.
      security:
        - adminAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NameEnquiry'
      responses:
        '200':
          description: Name successfully retrieved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessfulNameEnquiryResponse'
        '400':
          description: Bad request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthenticated request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorUnauthorized'
  /hub/bills/get-services:
    get:
      summary: Get biller services
      description: Retrieves all biller services.
      security:
        - adminAuth: []
      responses:
        '200':
          description: Billers retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetrievedBillersResponse'
        '400':
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /hub/bills/lookup:
    post:
      summary: Look up account
      description: Look up account per specific biller, by reference.
      security:
        - adminAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BillAccountLookup'
      responses:
        '200':
          description: Bill service account details retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetrievedBillerAccountResponse'
        '400':
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /hub/bills/pay:
    post:
      summary: Pay bill
      description: Initiate a bill payment, after lookup.
      security:
        - adminAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BillPayment'
      responses:
        '200':
          description: Bill payment succesfully initiated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillPaymentInitiatedResponse'
        '400':
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /hub/bills/purchase-airtime:
    post:
      summary: Purchase airtime
      description: Initiate an airtime purchase
      security:
        - adminAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AirtimePurchase'
      responses:
        '200':
          description: Bill payment succesfully initiated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessfulTransactionResponse'
        '400':
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /hub/bills/ecg/check-meter-status/{meterId}:
    get:
      summary: Check meter status
      description: Retrieves meter live status.
      security:
        - adminAuth: []
      parameters:
        - name: meterId
          in: path
          description: ID of the meter
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Meter status successfully retrieved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetrievedECGMeterStatusResponse'
        '400':
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /hub/bills/ecg/get-meters-by-phone-number/{phoneNumber}:
    get:
      summary: Get meters by phone number
      description: Retrieves meters linked to specified phone number.
      security:
        - adminAuth: []
      parameters:
        - name: phoneNumber
          in: path
          description: Saved phone number
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Meters successfully retrieved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetrievedECGMetersResponse'
        '400':
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /hub/bills/get-data-bundles:
    get:
      summary: Get data bundles by network
      description: Retrieves data bundles for a given network.
      security:
        - adminAuth: []
      parameters:
        - name: phoneNumber
          in: query
          description: Phone number
          required: true
          schema:
            type: string
        - name: network
          in: query
          description: Mobile network
          required: true
          schema:
            type: string
            enum:
              - MTN
              - Telecel
              - AT
      responses:
        '200':
          description: Data bundles successfully retrieved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetrievedDataBundlesResponse'
        '400':
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /hub/bills/purchase-data-bundle:
    post:
      summary: Purchase data bundle
      description: Initiates data bundle purchase.
      security:
        - adminAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DataBundlePurchase'
      responses:
        '200':
          description: Data bundle purchase successfully initiated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessfulTransactionResponse'
        '400':
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /webhooks/get/{id}:
    get:
      summary: Get webhook event
      description: Retrieves a webhook event
      security:
        - adminAuth: []
      parameters:
        - name: id
          in: path
          description: ID of the event
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Webhook event retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetrievedEventResponse"
        '500':
          description: Webhook event error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventError'
        '400':
          description: Bad request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /webhooks/get/{merchant}/{page}:
    get:
      summary: Get all webhook events
      description: Retrieves all webhook events for a merchant.
      x-mint:
        content: "<Note>Event record pages are 100 objects long.</Note>"
      security:
        - adminAuth: []
      parameters:
        - name: merchant
          in: path
          description: Merchant ID
          required: true
          schema:
            type: string
        - name: page
          in: path
          description: Pagination; offset in results response. Page size is 100.
          required: true
          schema:
            type: number
      responses:
        '200':
          description: Webhook events retrieved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetrievedEventsResponse"
        '500':
          description: Webhook event error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventError'
        '400':
          description: Bad request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /webhooks/fire/{id}:
    get:
      summary: Fire webhook event
      description: Fires a webhook event delivery
      security:
        - adminAuth: []
      parameters:
        - name: id
          in: path
          description: ID of the event
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Webhook event delivery initiated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        '500':
          description: Webhook event error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventError'
        '400':
          description: Bad request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthenticated request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorUnauthorized'
components:
  schemas:
    TransactionToken:
      required:
        - merchantId
        - apikey
      type: object
      properties:
        merchantId:
          description: The merchant's merchantId
          type: string
        apikey:
          description: The apikey for the app to collect through
          type: string
    TypeOfTransactionToken:
      allOf:
        - $ref: '#/components/schemas/TransactionToken'
        - required:
            - operation
          type: object
          properties:
            operation:
              description: The kind of operation to perform
              type: string
              enum:
                - DEBIT
                - CREDIT
    Collections:
      required:
        - amount
        - account_name
        - description
        - callbackUrl
      type: object
      properties:
        amount:
          description: Total amount to collect
          type: number
          format: float
        account_name:
          description: Account holder name
          type: string
        description:
          description: Brief description of the transaction
          type: string
          pattern: '^[a-zA-Z0-9.-_,]{0,50}$'
        callbackUrl:
          type: string
          description: The URL that will receive webhook containing transaction status.
        externalTransactionId:
          type: string
          description: Optional ID the requester can pass in to track the transaction
        account_type:
          type: string
          default: "momo"
          description: Type of payment account
    MomoCollections:
      allOf:
        - $ref: '#/components/schemas/Collections'
        - required:
            - account_number
            - account_issuer
          type: object
          properties:
            account_number:
              description: Account number
              type: string
              pattern: '^[0-9]{10}$'
            account_issuer:
              description: Account number's network provider
              type: string
              enum:
                - mtn
                - vodafone
                - airteltigo
    CardCollections:
      allOf:
        - $ref: '#/components/schemas/Collections'
        - required:
            - card
            - clientRedirectUrl
          type: object
          properties:
            card:
              description: Object containing card details
              type: object
              properties:
                cvc:
                  type: string
                  maximum: 3
                  description: Security code
                expiry:
                  type: string
                  description: Card expiry date; e.g. 5/2025
                number:
                  type: string
                  description: Card number
            clientRedirectUrl:
              description: URL to redirect to upon completed card payment
              type: string
    CheckoutCollections:
      allOf:
        - $ref: '#/components/schemas/Collections'
        - required:
            - clientRedirectUrl
          type: object
          properties:
            clientRedirectUrl:
              description: URL to redirect to upon completed collection
              type: string
    Disbursements:
      required:
        - amount
        - account_name
        - description
        - account_number
        - account_issuer
        - account_type
        - callbackUrl
      type: object
      properties:
        amount:
          description: Total amount to disburse
          type: number
          format: float
        account_name:
          description: Account holder name
          type: string
        description:
          description: Brief description of the transaction
          type: string
        callbackUrl:
          type: string
          description: The URL that will receive webhook notification containing transaction status.
        account_number:
          type: string
          description: The recipient's account number (phone number or bank account number).
        externalTransactionId:
          type: string
          description: Custom transaction ID to track transaction.
        account_issuer:
          type: string
          description: Institution the recipient's account belongs to. [Full list of potential values.](/concepts/account-issuers)
          enum:
            - mtn
            - vodafone
            - airteltigo
        account_type:
          type: string
          description: The type of account; momo or bank
          enum:
            - bank
            - momo
    RemittanceTermination:
      type: object
      required:
        - payerName
        - recipientName
        - recipientAddress
        - payerPhoneNumber
        - recipientPhoneNumber
        - countryOfOrigin
        - recipientGender
        - originalCurrency
        - originalAmount
        - destinationAmount
        - description
        - externalTransactionId
        - accountNumber
        - accountName
        - accountIssuer
        - accountType
        - callbackUrl
      properties:
        payerName:
          type: string
          description: Name of the payer initiating the remittance
        recipientName:
          type: string
          description: Name of the recipient receiving the funds
        recipientAddress:
          type: string
          description: Recipient's complete address
        payerPhoneNumber:
          type: string
          description: Payer's phone number
        recipientPhoneNumber:
          type: string
          description: Recipient's phone number
        countryOfOrigin:
          type: string
          description: Currency origin country code [(ISO 3166-1 alpha-2)](https://en.wikipedia.org/wiki/ISO_3166-1_alpha-2)
          maxLength: 2
        recipientGender:
          type: string
          enum:
            - male
            - female
          description: Recipient's gender (case-sensitive enumeration)
        originalCurrency:
          type: string
          format: currency
          description: Original transaction currency code [(ISO 4217)](https://en.wikipedia.org/wiki/ISO_4217)
        originalAmount:
          type: number
          format: positive
          description: Original transaction amount (float)
        destinationAmount:
          type: number
          format: positive
          description: Destination/converted amount (float)
        description:
          type: string
          description: Transaction description or purpose
        externalTransactionId:
          type: string
          description: Client-provided transaction identifier
        accountNumber:
          type: string
          description: Payment destination account number (format specific to bank/momo)
        accountName:
          type: string
          minLength: 3
          maxLength: 50
          description: Name associated with accountNumber
        accountIssuer:
          type: string
          description: Issuer of the account (bank name or mobile money provider)
        accountType:
          type: string
          enum:
            - momo
            - bank
          default: momo
          description: Payment account type (default; momo)
        callbackUrl:
          type: string
          format: uri
          description: Endpoint for receiving transaction status updates
    BillAccountLookup:
      type: object
      required:
        - billServiceProductId
        - billServiceProviderId
        - accountReference
      properties:
        billServiceProviderId:
          type: string
          description: The ID of the designated service provider
        billServiceProductId:
          type: string
          description: The ID of the designated service provider's product
        accountReference:
          type: string
          description: The reference for the account the payment is for
    BillPayment:
      type: object
      required:
        - accountReference
        - amount
        - lastMethod
        - sessionId
        - phoneNumber
        - description
        - payerName
        - externalTransactionId
        - billServiceProviderId
        - billServiceProductId
        - billServiceProductName
        - billServiceProviderName
      properties:
        accountReference:
          type: string
          description: The reference of the account the payment is for
        amount:
          type: number
          description: Cedi (GHS) amount of the payment
        lastMethod:
          type: string
          enum: ["lookup", "commit"]
          description: Specify the most recently called function in this session
        sessionId:
          type: string
          description: ID for current session
        phoneNumber:
          type: string
          description: Phone number of payer
        description:
          type: string
          description: Description for bill payment transaction
        payerName:
          type: string
          description: Name of entity performing payment
        externalTransactionId:
          type: string
          description: Third-party ID to track transaction
        callbackUrl:
          type: string
          description: HTTP POST endpoint to receive notifications
        billServiceProviderId:
          type: string
          description: The ID of the designated service provider
        billServiceProductId:
          type: string
          description: The ID of the designated service provider's product
        billServiceProviderName:
          type: string
          description: The name of the designated service provider
        billServiceProductName:
          type: string
          description: The name of the designated service provider's product
