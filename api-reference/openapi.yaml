    User:
      type: object
      description: A user account with an optional reference to an associated merchant.
      properties:
        _id:
          type: string
          description: Unique identifier for the user.
        email:
          type: string
          format: email
          description: The user's email address.
        name:
          type: string
          description: Display name of the user.
        phone:
          type: string
          description: Contact phone number of the user.
        isActive:
          type: boolean
          description: Whether the user account is currently active.
        merchantId:
          $ref: '#/components/schemas/Merchant'
        permissions:
          type: array
          items:
            type: string
          description: List of permissions granted to the user.
        isPasswordChanged:
          type: boolean
          description: Indicates whether the user has changed their initial password.
        lastSeen:
          type: string
          format: date-time
          description: Timestamp of the user's most recent activity.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the user account was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the user account was last updated.
        __v:
          type: integer
          description: Version key for optimistic locking.
    Merchant:
      type: object
      description: A merchant record with business profile, KYC details, account status, and payment channel configuration.
      required:
        - _id
        - merchant_tradeName
        - envMode
      properties:
        _id:
          type: string
          description: Unique MongoDB ObjectId for the merchant record.
        merchantNickName:
          type: string
          nullable: true
          description: Optional short display name for the merchant.
        merchant_tradeName:
          type: string
          description: Registered trade name of the merchant business.
          examples: BSYSTEMS PEOPLESPAY
        # --- Business identity / KYC ---
        businessPhone:
          type: string
          description: Primary business contact phone.
          examples: "0302 254340"
        email:
          type: string
          format: email
          description: Primary business contact email.
          examples: info@bsystemslimited.com
        registrationNumber:
          type: string
          description: Official business registration number.
          examples: CS433052014
        idNumber:
          type: string
          description: Government-issued identification number for the merchant.
          examples: GHA-725794423-3
        address:
          type: string
          description: Physical business address.
          examples: Mango Lane, Asylum Down
        location:
          type: string
          description: General locality or city of the business.
          examples: Asylum Down, Accra
        lineOfBusiness:
          type: string
          description: Primary industry or trade category.
          examples: Agency Banking
        # --- Account status flags ---
        submitted:
          type: boolean
          description: Whether onboarding details have been submitted.
          examples: true
        decline:
          type: boolean
          description: Whether the merchant application has been declined.
          examples: false
        active:
          type: boolean
          description: Whether the merchant account is currently active.
          examples: true
        # --- Payment channel configuration ---
        ussdCode:
          type: string
          description: USSD shortcode assigned to the merchant.
          examples: "*421*2#"
        isUSSDActive:
          type: boolean
          description: Whether the USSD channel is enabled.
          examples: true
        cardDebitChannel:
          type: string
          description: Card debit processing channel.
          examples: GTBLocal
        momoDebitChannel:
          type: string
          description: Mobile money debit processing channel.
          examples: TELCO
        # --- Financial limits ---
        creditLimit:
          type: number
          description: Maximum credit extended to the merchant.
          examples: 10000
        debitLimit:
          type: number
          description: Maximum aggregate debit allowed per period.
          examples: 10000
        disbursementCharge:
          type: number
          description: Fee applied per disbursement transaction.
          examples: 0
        minimumAmount:
          type: number
          description: Minimum transaction amount permitted.
          examples: 0
        # --- Timestamps ---
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the merchant record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the merchant record was last updated.
    Event:
      type: object
      properties:
        _id:
          type: string
          description: Event ID.
        eventType:
          type: string
          description: "[Event type](/events/events-overview)."
        createdAt:
          type: string
          description: ISO timestamp of event creation.
        eventData:
          type: object<Event>
          description: "Event data, of type [event object](/api-reference/events)"
        deliveryStatus: 
          type: string
          enum:
            - DELIVERY_ATTEMPTED
            - DELIVERED
            - FAILED
            - AWAITING_DELIVERY
          description: Delivery status for webhook notification.
        destination:
          type: string
          description: Merchant URL webhook notification is delivered to.
        customerId:
          type: string
          description: ID of customer event was created for.
        customerType:
          type: string
          enum:
            - merchants
            - customer
          description: Type of customer event was created for.
          default: merchants
        lastAttemptedAt:
          type: string
          description: ISO timestamp of most recent delivery attempt.
        numberOfAttempts:
          type: integer
          format: int32
          description: Count of attempted deliveries to `destination`
  securitySchemes:
    adminAuth:
      type: http
      scheme: bearer
      description: Bearer authentication header of the form `Bearer <token>`, where `<token>` is the [merchant login token](/api-reference/endpoint/merchant-login).
    operationAuth:
      type: http
      scheme: bearer
      description: Bearer authentication header of the form `Bearer <token>`, where `<token>` is the [transaction execution authentication token](/api-reference/endpoint/get-token-collection).
